! ============================================================================
! TEMPLATE - NOT APPLIED IN PROJECT 2.
! Phase-2 prerequisite for Project 5 (Microsoft Azure Site-to-Site VPN).
! Apply ONLY when the Azure VPN Gateway + Local Network Gateway exist.
! Reserved blocks per azure-vpn-reservation.md:
!   - On-prem  : R1 Tunnel0 = 10.20.254.9/30
!   - Azure VNet space: 10.20.200.0/24
!   - BGP APIPA inside tunnel: 169.254.21.0/30
! ============================================================================

! --- IKEv2 proposal/policy (modern, GCM) ------------------------------------
crypto ikev2 proposal AZURE-PROPOSAL
 encryption aes-gcm-256
 prf sha384
 group 19
!
crypto ikev2 policy AZURE-POLICY
 match fvany
 proposal AZURE-PROPOSAL
!
crypto ikev2 keyring AZURE-KEYRING
 peer AZURE-GW
  address <AZURE-VPN-GW-PUBLIC-IP>
  pre-shared-key <ROTATED-STRONG-PSK>
!
crypto ikev2 profile AZURE-PROFILE
 match identity remote address <AZURE-VPN-GW-PUBLIC-IP> 255.255.255.255
 identity local address 203.0.113.2
 authentication local pre-share
 authentication remote pre-share
 keyring local AZURE-KEYRING
 dpd 10 3 on-demand
!
crypto ipsec transform-set AZURE-TSET esp-gcm 256
 mode tunnel
!
crypto ipsec profile AZURE-IPSEC-PROFILE
 set transform-set AZURE-TSET
 set ikev2-profile AZURE-PROFILE
!
! --- Tunnel interface (uses the RESERVED 10.20.254.8/30 transit) --------------
interface Tunnel0
 description S2S-VPN TO AZURE VNET (10.20.200.0/24) - PROJECT 5
 ip address 10.20.254.9 255.255.255.252
 ip tcp adjust-mss 1350
 tunnel source GigabitEthernet0/0
 tunnel destination <AZURE-VPN-GW-PUBLIC-IP>
 tunnel mode ipsec ipv4
 tunnel protection ipsec profile AZURE-IPSEC-PROFILE
!
! --- BGP toward Azure (Azure VPN Gateway default ASN 65515) --------------------
! Azure Local Network Gateway must set:
!   - peer APIPA 169.254.21.1, ASN 65515
!   - our public endpoint 203.0.113.2
!   - our address space 10.20.0.0/16
router bgp 65001
 bgp router-id 10.20.255.1
 neighbor 169.254.21.1 remote-as 65515
 neighbor 169.254.21.1 ebgp-multihop 5
 neighbor 169.254.21.1 update-source Tunnel0
 ! Controlled aggregate only - OSPF Area 0 stays stable if the tunnel flaps:
 network 10.20.0.0 mask 255.255.0.0
!
! --- Edge ACL interaction ------------------------------------------------------
! EDGE-INBOUND on Gi0/0 must additionally permit UDP 500/4500 from the Azure GW
! before activation (placeholder):
! ip access-list extended EDGE-INBOUND
!  permit udp host <AZURE-VPN-GW-PUBLIC-IP> any eq isakmp
!  permit udp host <AZURE-VPN-GW-PUBLIC-IP> any eq 4500
!  (insert BEFORE the final "deny ip any any log")
! ============================================================================
! END OF TEMPLATE - do not paste into production without Project 5 review.
! ============================================================================
