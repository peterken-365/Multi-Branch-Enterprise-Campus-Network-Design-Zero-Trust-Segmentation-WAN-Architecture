# Ansible inventory - Savannah Logistics enterprise network
# Used by playbook.yml for agentless config backup + drift reporting.
# Requires: ansible with cisco.ios collection, SSH keys as netadmin.

[savannah_network]
R1-HQ-EDGE          ansible_host=10.20.255.1
R2-MOMBASA-EDGE     ansible_host=10.20.255.2
MLS-HQ-CORE         ansible_host=10.20.99.1
SW1-HQ-ACCESS-1     ansible_host=10.20.99.2
SW2-HQ-ACCESS-2     ansible_host=10.20.99.3
SW3-MOMBASA-ACCESS  ansible_host=10.20.99.18

[savannah_network:vars]
ansible_user=netadmin
ansible_network_os=cisco.ios.ios
ansible_connection=ansible.netcommon.network_cli
