! ============================================================================
! SAVANNAH LOGISTICS LTD - MULTI-BRANCH ENTERPRISE NETWORK (PROJECT 2)
! Device   : MLS-HQ-CORE
! Platform : Catalyst 3650-24PS (IOS 15.x/IOS-XE)
! Role     : Inter-VLAN routing (SVIs) | Rapid PVST+ ROOT | OSPF Area 0 | DHCP relay
!            Gateway ACLs: FINANCE-IN / GUEST-IN / MGMT-PLANE
! Standard : Device Hardening Standard v1.0 (Pillar 1)
! Build    : paste into (config)#, then EXEC: crypto key generate rsa modulus 2048
! NOTE     : credentials are LAB/DESIGN values - ROTATE before production.
! ============================================================================

hostname MLS-HQ-CORE
!
no ip domain-lookup
ip domain-name savannah-logistics.local
service timestamps log datetime msec localtime show-timezone
service timestamps debug datetime msec localtime show-timezone
service password-encryption
login block-for 120 attempts 3 within 60
clock timezone EAT 3 0
!
enable secret Svl#En4ble#2024
username netadmin secret Svl!N3t#2024
! PRODUCTION-ONLY: use algorithm-type scrypt for both secrets.
!
banner motd ^C
***********************************************************
  AUTHORIZED ACCESS ONLY
  This system is the property of Savannah Logistics Ltd.
  Unauthorized access attempts are prohibited and logged.
  Disconnect IMMEDIATELY if you are not an authorized user.
  Contact: netops@savannah-logistics.co.ke
***********************************************************
^C
!
! --- Layer 3 switching enabled -----------------------------------------------
ip routing
!
! --- VLAN database (VLAN 1 carries NOTHING) ----------------------------------
vlan 10
 name IT-ADMIN
vlan 20
 name FINANCE-HR
vlan 30
 name INTERNAL-SERVERS
vlan 40
 name GUEST-BYOD
vlan 99
 name NET-MGMT
vlan 999
 name QUARANTINE
!
! --- Spanning Tree: explicit root, never left to chance -----------------------
spanning-tree mode rapid-pvst
spanning-tree vlan 10 root primary
spanning-tree vlan 20 root primary
spanning-tree vlan 30 root primary
spanning-tree vlan 40 root primary
spanning-tree vlan 99 root primary
spanning-tree vlan 999 root primary
!
! --- Unused ports: quarantine + shutdown --------------------------------------
interface range GigabitEthernet1/0/3 - 24
 description QUARANTINE - UNUSED PORTS (VLAN 999, SHUTDOWN)
 switchport mode access
 switchport access vlan 999
 shutdown
!
! --- Trunks -------------------------------------------------------------------
interface GigabitEthernet1/0/1
 description TRUNK TO SW1-HQ-ACCESS-1 Gi0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,40,99,999
 switchport nonegotiate
 spanning-tree link-type point-to-point
!
interface GigabitEthernet1/0/2
 description TRUNK TO SW2-HQ-ACCESS-2 Gi0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 30,99,999
 switchport nonegotiate
 spanning-tree link-type point-to-point
!
! --- Routed uplink to R1 (Link B) ----------------------------------------------
interface GigabitEthernet1/1/1
 description LINK-B: P2P TO R1-HQ-EDGE Gi0/1 (10.20.254.4/30)
 no switchport
 ip address 10.20.254.6 255.255.255.252
 no shutdown
!
! --- SVI gateways + DHCP relay + zero-trust gateway ACLs -----------------------
interface Vlan10
 description GATEWAY VLAN 10 - IT ADMIN (10.20.10.0/26)
 ip address 10.20.10.1 255.255.255.192
 ip helper-address 10.20.30.10
 no shutdown
!
interface Vlan20
 description GATEWAY VLAN 20 - FINANCE (10.20.20.0/25)
 ip address 10.20.20.1 255.255.255.128
 ip helper-address 10.20.30.10
 ip access-group FINANCE-IN in
 no shutdown
!
interface Vlan30
 description GATEWAY VLAN 30 - SERVERS (10.20.30.0/27)
 ip address 10.20.30.1 255.255.255.224
 no shutdown
!
interface Vlan40
 description GATEWAY VLAN 40 - GUEST (10.20.40.0/24)
 ip address 10.20.40.1 255.255.255.0
 ip helper-address 10.20.30.10
 ip access-group GUEST-IN in
 no shutdown
!
interface Vlan99
 description GATEWAY VLAN 99 - HQ NET-MGMT (10.20.99.0/28)
 ip address 10.20.99.1 255.255.255.240
 ip access-group MGMT-PLANE out
 no shutdown
!
! --- East-west zero-trust ACLs (Pillar 3) --------------------------------------
ip access-list extended FINANCE-IN
 remark === Finance VLAN 20 -> Servers VLAN 30: approved app ports only ===
 permit udp any any eq bootps
 permit udp 10.20.20.0 0.0.0.127 host 10.20.30.12 eq domain
 permit tcp 10.20.20.0 0.0.0.127 10.20.30.0 0.0.0.31 eq www
 permit tcp 10.20.20.0 0.0.0.127 10.20.30.0 0.0.0.31 eq 443
 permit tcp 10.20.20.0 0.0.0.127 10.20.30.0 0.0.0.31 eq 1433
 permit icmp 10.20.20.0 0.0.0.127 10.20.30.0 0.0.0.31 echo
 permit udp 10.20.20.0 0.0.0.127 10.20.30.0 0.0.0.31 range 33434 33534
 deny ip 10.20.20.0 0.0.0.127 10.20.30.0 0.0.0.31
 remark All other Finance traffic (Internet, other VLANs) is permitted
 permit ip any any
!
ip access-list extended GUEST-IN
 remark === Guest VLAN 40: DNS + DHCP in, HTTP/HTTPS out, nothing internal ===
 permit udp any any eq bootps
 permit udp any any eq domain
 deny ip any 10.20.0.0 0.0.255.255
 permit tcp any any eq www
 permit tcp any any eq 443
 deny ip any any log
!
ip access-list extended MGMT-PLANE
 remark === Guard INTO HQ mgmt VLAN 99: IT Admin SSH/ICMP + NTP replies only ===
 permit tcp 10.20.10.0 0.0.0.63 10.20.99.0 0.0.0.15 eq 22
 permit icmp 10.20.10.0 0.0.0.63 10.20.99.0 0.0.0.15
 permit udp host 10.20.30.11 10.20.99.0 0.0.0.15 eq ntp
 deny ip any 10.20.99.0 0.0.0.15 log
!
! --- Management-plane access control (T-06) ------------------------------------
ip access-list standard MGMT-ACCESS
 remark VTY: IT Admin VLAN 10 (10.20.10.0/26) ONLY
 permit 10.20.10.0 0.0.0.63
 deny   any log
!
line con 0
 exec-timeout 10 0
 logging synchronous
 login local
line vty 0 4
 transport input ssh
 exec-timeout 10 0
 logging synchronous
 login local
 access-class MGMT-ACCESS in
!
! --- Dynamic routing: OSPFv2 single Area 0 -------------------------------------
router ospf 10
 router-id 3.3.3.3
 passive-interface default
 no passive-interface GigabitEthernet1/1/1
 network 10.20.254.4 0.0.0.3 area 0
 network 10.20.10.0 0.0.0.63 area 0
 network 10.20.20.0 0.0.0.127 area 0
 network 10.20.30.0 0.0.0.31 area 0
 network 10.20.40.0 0.0.0.255 area 0
 network 10.20.99.0 0.0.0.15 area 0
!
no ip http server
no ip http secure-server
! PRODUCTION-ONLY: errdisable recovery cause all interval 300
!
! --- Central time + logging -----------------------------------------------------
ntp server 10.20.30.11 source Vlan99
logging host 10.20.30.11
logging trap informational
logging buffered 16384 informational
logging source-interface Vlan99
!
end
