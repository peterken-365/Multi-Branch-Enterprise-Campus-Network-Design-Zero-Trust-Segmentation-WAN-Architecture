! ============================================================================
! SAVANNAH LOGISTICS LTD - MULTI-BRANCH ENTERPRISE NETWORK (PROJECT 2)
! Device   : SW1-HQ-ACCESS-1
! Platform : Catalyst 2960-24TT (production: 2960-X / 9200)
! Role     : HQ user access - IT (10), Finance (20), Guest Wi-Fi+wired (40)
!            STP Root Secondary | Port-Security + DHCP Snooping + DAI
! Standard : Device Hardening Standard v1.0 (Pillar 1)
! Build    : paste into (config)#, then EXEC: crypto key generate rsa modulus 2048
! NOTE     : credentials are LAB/DESIGN values - ROTATE before production.
! ============================================================================

hostname SW1-HQ-ACCESS-1
!
no ip domain-lookup
ip domain-name savannah-logistics.local
service timestamps log datetime msec localtime show-timezone
service timestamps debug datetime msec localtime show-timezone
service password-encryption
login block-for 120 attempts 3 within 60
clock timezone EAT 3 0
!
enable secret Svl#En4ble#2024
username netadmin secret Svl!N3t#2024
! PRODUCTION-ONLY: use algorithm-type scrypt for both secrets.
!
banner motd ^C
***********************************************************
  AUTHORIZED ACCESS ONLY
  This system is the property of Savannah Logistics Ltd.
  Unauthorized access attempts are prohibited and logged.
  Disconnect IMMEDIATELY if you are not an authorized user.
  Contact: netops@savannah-logistics.co.ke
***********************************************************
^C
!
! --- VLAN database -------------------------------------------------------------
vlan 10
 name IT-ADMIN
vlan 20
 name FINANCE-HR
vlan 40
 name GUEST-BYOD
vlan 99
 name NET-MGMT
vlan 999
 name QUARANTINE
!
! --- STP: deterministic secondary root for HQ user VLANs ------------------------
spanning-tree mode rapid-pvst
spanning-tree vlan 10 root secondary
spanning-tree vlan 20 root secondary
spanning-tree vlan 40 root secondary
spanning-tree vlan 99 root secondary
!
! --- L2 attack mitigation: DHCP Snooping + DAI (Pillar 3) ------------------------
ip dhcp snooping
ip dhcp snooping vlan 10
ip dhcp snooping vlan 20
ip dhcp snooping vlan 40
no ip dhcp snooping information option
ip arp inspection vlan 10
ip arp inspection vlan 20
ip arp inspection vlan 40
!
! --- Uplink trunk ----------------------------------------------------------------
interface GigabitEthernet0/1
 description UPLINK TRUNK TO MLS-HQ-CORE Gi1/0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,40,99,999
 switchport nonegotiate
 spanning-tree link-type point-to-point
 ip dhcp snooping trust
 ip arp inspection trust
!
! --- IT Admin access ports (VLAN 10) ----------------------------------------------
interface range FastEthernet0/1 - 2
 description IT ADMIN ACCESS - VLAN 10
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 spanning-tree portfast
 spanning-tree bpduguard enable
!
! --- Finance access ports (VLAN 20) ------------------------------------------------
interface range FastEthernet0/3 - 10
 description FINANCE/HR ACCESS - VLAN 20
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 spanning-tree portfast
 spanning-tree bpduguard enable
!
! --- Guest Wi-Fi AP port (VLAN 40) - wider MAC budget, non-disruptive mode ------
interface FastEthernet0/11
 description GUEST Wi-Fi ACCESS POINT - VLAN 40
 switchport mode access
 switchport access vlan 40
 switchport port-security
 switchport port-security maximum 10
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
!
! --- Wired guest ports (VLAN 40) ----------------------------------------------------
interface range FastEthernet0/12 - 18
 description WIRED GUEST ACCESS - VLAN 40
 switchport mode access
 switchport access vlan 40
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 spanning-tree portfast
 spanning-tree bpduguard enable
!
! --- Unused ports: quarantine + shutdown --------------------------------------------
interface range FastEthernet0/19 - 24
 description QUARANTINE - UNUSED PORTS (VLAN 999, SHUTDOWN)
 switchport mode access
 switchport access vlan 999
 shutdown
!
! --- Management SVI + gateway --------------------------------------------------------
interface Vlan99
 description NET-MGMT SVI (HQ VLAN 99)
 ip address 10.20.99.2 255.255.255.240
 no shutdown
!
ip default-gateway 10.20.99.1
!
! --- Management-plane access control (T-06) -------------------------------------------
ip access-list standard MGMT-ACCESS
 remark VTY: IT Admin VLAN 10 (10.20.10.0/26) ONLY
 permit 10.20.10.0 0.0.0.63
 deny   any log
!
line con 0
 exec-timeout 10 0
 logging synchronous
 login local
line vty 0 4
 transport input ssh
 exec-timeout 10 0
 logging synchronous
 login local
 access-class MGMT-ACCESS in
!
no ip http server
! PRODUCTION-ONLY: storm-control broadcast level 10.00 | storm-control multicast
!                  level 5.00 | errdisable recovery cause all interval 300 | udld
!
! --- Central time + logging ------------------------------------------------------------
ntp server 10.20.30.11 source Vlan99
logging host 10.20.30.11
logging trap informational
logging buffered 16384 informational
logging source-interface Vlan99
!
end
