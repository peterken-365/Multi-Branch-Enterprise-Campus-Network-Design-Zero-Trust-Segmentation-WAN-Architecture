! ============================================================================
! SAVANNAH LOGISTICS LTD - MULTI-BRANCH ENTERPRISE NETWORK (PROJECT 2)
! Device   : R1-HQ-EDGE
! Platform : Cisco ISR (Packet Tracer: 2911 | production: ISR 4331, IOS-XE 17.x)
! Role     : OSPF Area 0 edge | NAT/PAT overload boundary | North-south edge ACL
! Standard : Device Hardening Standard v1.0 (Pillar 1)
! Build    : paste into (config)#, then EXEC: crypto key generate rsa modulus 2048
! NOTE     : credentials are LAB/DESIGN values - ROTATE before production.
! ============================================================================

hostname R1-HQ-EDGE
!
! --- Management-plane foundation --------------------------------------------
no ip domain-lookup
ip domain-name savannah-logistics.local
service timestamps log datetime msec localtime show-timezone
service timestamps debug datetime msec localtime show-timezone
service password-encryption
login block-for 120 attempts 3 within 60
clock timezone EAT 3 0
!
enable secret Svl#En4ble#2024
username netadmin secret Svl!N3t#2024
! PRODUCTION-ONLY: use "enable algorithm-type scrypt secret ..." and
!                  "username netadmin algorithm-type scrypt secret ..."
!
banner motd ^C
***********************************************************
  AUTHORIZED ACCESS ONLY
  This system is the property of Savannah Logistics Ltd.
  Unauthorized access attempts are prohibited and logged.
  Disconnect IMMEDIATELY if you are not an authorized user.
  Contact: netops@savannah-logistics.co.ke
***********************************************************
^C
!
! --- Interfaces -------------------------------------------------------------
interface GigabitEthernet0/0
 description EXTERNAL: ISP EDGE (PUBLIC - NAT OUTSIDE + EDGE ACL)
 ip address 203.0.113.2 255.255.255.252
 ip access-group EDGE-INBOUND in
 ip nat outside
 no shutdown
!
interface GigabitEthernet0/1
 description LINK-B: P2P TRANSIT TO MLS-HQ-CORE Gi1/1/1 (10.20.254.4/30)
 ip address 10.20.254.5 255.255.255.252
 ip nat inside
 no shutdown
!
interface GigabitEthernet0/2
 description LINK-A: P2P WAN TO R2-MOMBASA-EDGE Gi0/0 (10.20.254.0/30)
 ip address 10.20.254.1 255.255.255.252
 ip nat inside
 no shutdown
!
interface Loopback0
 description MGMT: SSH ENDPOINT + NTP SOURCE + OSPF RID ANCHOR
 ip address 10.20.255.1 255.255.255.255
!
! --- Default route to ISP ----------------------------------------------------
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
! --- NAT/PAT boundary --------------------------------------------------------
ip access-list extended NAT-PERMITTED
 remark NAT criteria: enterprise 10.20.0.0/16 toward non-enterprise ONLY
 remark Internal-to-internal traffic is NEVER translated, so VTY/MGMT ACLs
 remark always see true source addresses (zero-trust management plane).
 deny   ip 10.20.0.0 0.0.255.255 10.20.0.0 0.0.255.255
 permit ip 10.20.0.0 0.0.255.255 any
!
ip nat inside source list NAT-PERMITTED interface GigabitEthernet0/0 overload
!
! --- North-south edge filter (inbound from ISP) ------------------------------
ip access-list extended EDGE-INBOUND
 remark Perimeter: only return traffic for sessions initiated inside
 permit tcp any any established
 permit udp any eq domain any
 permit icmp any any echo-reply
 permit icmp any any time-exceeded
 permit icmp any any unreachable
 deny   ip any any log
!
! --- Dynamic routing: OSPFv2 single Area 0 -----------------------------------
! PT fallback if "passive-interface default" is rejected on your IOS image:
!   passive-interface GigabitEthernet0/0
router ospf 10
 router-id 1.1.1.1
 passive-interface default
 no passive-interface GigabitEthernet0/1
 no passive-interface GigabitEthernet0/2
 network 10.20.254.0 0.0.0.3 area 0
 network 10.20.254.4 0.0.0.3 area 0
 network 10.20.255.1 0.0.0.0 area 0
 default-information originate
!
! --- Management-plane access control (T-06) ----------------------------------
ip access-list standard MGMT-ACCESS
 remark VTY: IT Admin VLAN 10 (10.20.10.0/26) ONLY
 permit 10.20.10.0 0.0.0.63
 deny   any log
!
line con 0
 exec-timeout 10 0
 logging synchronous
 login local
line vty 0 4
 transport input ssh
 exec-timeout 10 0
 logging synchronous
 login local
 access-class MGMT-ACCESS in
!
! --- Hardening extras ---------------------------------------------------------
no ip http server
no ip http secure-server
no ip source-route
! PRODUCTION-ONLY (not supported in Packet Tracer):
!  ip options drop
!  login on-failure log
!  errdisable recovery cause all interval 300
!
! --- Central time + logging (Projects 4/5 preparation) ------------------------
ntp server 10.20.30.11 source Loopback0
logging host 10.20.30.11
logging trap informational
logging buffered 16384 informational
logging source-interface Loopback0
!
end
